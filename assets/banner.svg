<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#1f2937"/></linearGradient><linearGradient id="accentGradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="glowGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#60a5fa" stop-opacity=".8"/><stop offset="100%" stop-color="#a855f7" stop-opacity=".2"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#374151" stroke-opacity=".4" stroke-width=".7" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1.5" fill="#60a5fa" fill-opacity=".3"/></pattern><style>@keyframes floatGrid{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes pulseGlow{0%{opacity:.3;transform:scale(.98)}50%{opacity:.7;transform:scale(1.02)}}@keyframes dashScan{0%{stroke-dashoffset:1000}}.animated-bg-grid{animation:floatGrid 8s ease-in-out infinite}.pulsing-glow{animation:pulseGlow 5s ease-in-out infinite;transform-origin:center}.scanning-line{stroke-dasharray:200,20;animation:dashScan 12s linear infinite}.rotating-gear{animation:rotateGear 20s linear infinite;transform-origin:1080px 70px}.badge-text,.subtitle-text,.title-text{font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:42px;fill:#fff}.subtitle-text{font-weight:500;font-size:19px;fill:#9ca3af}.badge-text{font-weight:600;font-size:13px;fill:#60a5fa}</style></defs><rect width="1200" height="300" fill="url(#bgGradient)" rx="16"/><circle cx="150" cy="80" r="180" fill="url(#glowGradient)" class="pulsing-glow" filter="blur(40px)"/><circle cx="1050" cy="220" r="160" fill="url(#glowGradient)" class="pulsing-glow" filter="blur(50px)"/><rect width="1200" height="300" fill="url(#grid)" class="animated-bg-grid" rx="16"/><path fill="none" stroke="url(#accentGradient)" stroke-width="2" d="M 50 250 L 350 250 L 420 280 L 1150 280" class="scanning-line" opacity=".6"/><path fill="none" stroke="#3b82f6" stroke-opacity=".4" stroke-width="1.5" d="M 100 20 L 800 20 L 880 50 L 1150 50" class="scanning-line"/><g class="rotating-gear" opacity=".15"><circle cx="1080" cy="70" r="45" fill="none" stroke="#60a5fa" stroke-dasharray="10 8" stroke-width="6"/><circle cx="1080" cy="70" r="25" fill="none" stroke="#60a5fa" stroke-width="3"/></g><rect width="1196" height="296" x="2" y="2" fill="none" stroke="url(#accentGradient)" stroke-opacity=".5" stroke-width="1.5" rx="14"/><g transform="translate(60, 48)"><rect width="280" height="32" fill="#1e293b" stroke="#3b82f6" stroke-width="1" rx="16"/><circle cx="18" cy="16" r="5" fill="#10b981"/><text x="32" y="21" class="badge-text">CONNECTED WORKER &amp; SOPs</text></g><text x="60" y="132" class="title-text">Awesome Manufacturing Knowledge Platform</text><rect width="480" height="4" x="60" y="148" fill="url(#accentGradient)" rx="2"/><text x="60" y="192" class="subtitle-text">Curated SaaS Platforms &amp; Open-Source Tools for Digital Work Instructions,</text><text x="60" y="220" class="subtitle-text">Standard Operating Procedures (SOPs), Skills Management &amp; Shop-Floor Operations.</text><g transform="translate(60, 248)"><rect width="130" height="26" x="0" y="0" fill="#1f2937" stroke="#4b5563" stroke-width="1" rx="6"/><text x="12" y="17" fill="#d1d5db" font-family="sans-serif" font-size="11" font-weight="600">⚡ Digital SOPs</text><rect width="145" height="26" x="142" y="0" fill="#1f2937" stroke="#4b5563" stroke-width="1" rx="6"/><text x="154" y="17" fill="#d1d5db" font-family="sans-serif" font-size="11" font-weight="600">🤖 AI Work Guidance</text><rect width="135" height="26" x="299" y="0" fill="#1f2937" stroke="#4b5563" stroke-width="1" rx="6"/><text x="311" y="17" fill="#d1d5db" font-family="sans-serif" font-size="11" font-weight="600">🛠️ Frontline Apps</text><rect width="145" height="26" x="446" y="0" fill="#1f2937" stroke="#4b5563" stroke-width="1" rx="6"/><text x="458" y="17" fill="#d1d5db" font-family="sans-serif" font-size="11" font-weight="600">🌐 Industry 4.0 / 5.0</text></g></svg>